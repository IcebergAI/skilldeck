name: Release

# A tag is the explicit release authorization. The workflow builds once, then
# carries the same verified bytes through attestation, PyPI, GitHub, and
# independent channel readback. The build job publishes the bundle's SHA-256
# digests as a job output, which GitHub passes to later jobs separately from
# the artifact; every job checks the bundle it downloads against that output
# before using it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time: a tag pushed while another release runs waits for it
# instead of racing it to PyPI, and a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Only a commit already on main that passes lint, types, and tests gets
  # built. This catches a tag pushed on the wrong commit by mistake; it cannot
  # stop a malicious tagger, because a tag push runs the tagged commit's own
  # copy of this file, which that commit can change. The `v*` tag ruleset and
  # the `pypi` environment's required reviewer (repository settings, see
  # docs/releasing.md) are the controls for that.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history plus origin/* branches, for the ancestry check
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: $GITHUB_REF ($GITHUB_SHA) is not reachable from main;" \
              "only tag commits that are already on main" >&2
            exit 1
          fi
      - name: Verify tag, package version, and CHANGELOG
        run: python3 scripts/check_release_consistency.py --tag "$GITHUB_REF"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Lint, type-check, and test the tagged commit
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .
          uv run --locked --extra dev mypy
          uv run --locked --extra dev pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      digests: ${{ steps.bundle.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Stamp exact release source identity
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/stamp_build_metadata.py \
            --source-ref "$GITHUB_REF" \
            --source-commit "$GITHUB_SHA"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build wheel and source distribution
        run: |
          uv build --out-dir dist
          python3 -c 'from pathlib import Path; Path("dist/.gitignore").unlink(missing_ok=True)'
      - name: Verify distributions and tagged plugin identity
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv run --locked --extra dev python scripts/verify_distribution_identity.py \
            --wheel dist/*.whl \
            --sdist dist/*.tar.gz \
            --plugin-dir claude-plugin \
            --expected-version "$EXPECTED_VERSION" \
            --expected-ref "$GITHUB_REF" \
            --expected-commit "$GITHUB_SHA" \
            --release-plugin
      # The SBOM describes this venv, so it must hold exactly what uv.lock pins
      # (hash-checked), not whatever a fresh resolve would pick at tag time.
      - name: Install only the release wheel and locked runtime dependencies
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv export --locked --no-dev --no-emit-project --no-header \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv venv .release-venv --python 3.14
          uv pip install --python .release-venv/bin/python \
            --require-hashes -r "$RUNNER_TEMP/runtime-requirements.txt"
          uv pip install --python .release-venv/bin/python --no-deps dist/*.whl
          uv pip check --python .release-venv/bin/python
          .release-venv/bin/skilldeck provenance --verify --json \
            > "$RUNNER_TEMP/provenance.json"
          python3 scripts/verify_provenance.py "$RUNNER_TEMP/provenance.json" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-ref "$GITHUB_REF" \
            --expected-commit "$GITHUB_SHA"
      - name: Generate SPDX runtime SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .release-venv
          format: spdx-json
          output-file: dist/skilldeck-${{ steps.release.outputs.version }}.spdx.json
          artifact-name: skilldeck-${{ steps.release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Validate SBOM, write checksums, and record bundle digests
        id: bundle
        run: |
          python3 scripts/verify_sbom.py dist/*.spdx.json
          python3 scripts/write_checksums.py dist
          python3 scripts/write_checksums.py --verify dist/SHA256SUMS
          DIGESTS=$(python3 scripts/write_checksums.py --digests dist)
          echo "digests=${DIGESTS}" >> "$GITHUB_OUTPUT"
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Check the bundle against the build job's digests
        env:
          EXPECTED_DIGESTS: ${{ needs.build.outputs.digests }}
        run: python3 scripts/write_checksums.py --expect "$EXPECTED_DIGESTS" dist
      - name: Attest artifact build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest checksum-file build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Attest wheel and source-distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/skilldeck-${{ needs.build.outputs.version }}.spdx.json

  publish-pypi:
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle
      - name: Check the bundle against the build job's digests; isolate Python distributions
        env:
          EXPECTED_DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          python3 scripts/write_checksums.py --expect "$EXPECTED_DIGESTS" release-bundle
          mkdir publish
          cp release-bundle/*.whl release-bundle/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish

  # PyPI uploads cannot be undone, so this cannot un-publish anything; it runs
  # before the GitHub release so a mismatch stops the release there (and the
  # maintainer yanks the PyPI files).
  verify-pypi:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Compare the files PyPI serves with the build job's digests
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          python3 scripts/verify_pypi_release.py \
            --version "$EXPECTED_VERSION" \
            --expected-digests "$EXPECTED_DIGESTS"
      - name: Verify PyPI's PEP 740 publish attestations
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          for BASENAME in "skilldeck-${EXPECTED_VERSION}-py3-none-any.whl" \
            "skilldeck-${EXPECTED_VERSION}.tar.gz"; do
            uvx -c .github/tools/requirements.txt pypi-attestations verify pypi \
              --repository https://github.com/IcebergAI/skilldeck \
              "pypi:$BASENAME"
          done

  github-release:
    needs: [build, attest, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle
      - name: Check the bundle against the build job's digests and publish the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          python3 scripts/write_checksums.py --expect "$EXPECTED_DIGESTS" release-bundle
          gh release create "$GITHUB_REF_NAME" release-bundle/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Skilldeck ${GITHUB_REF_NAME#v}"

  verify-channels:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Download fresh GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir downloaded
      - name: Verify fresh bytes and GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          python3 scripts/write_checksums.py --expect "$EXPECTED_DIGESTS" downloaded
          for ARTIFACT in downloaded/*.whl downloaded/*.tar.gz; do
            gh attestation verify "$ARTIFACT" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
            gh attestation verify "$ARTIFACT" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3
          done
      - name: Re-verify distribution identity from downloaded assets
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv run --locked --extra dev python scripts/verify_distribution_identity.py \
            --wheel downloaded/*.whl \
            --sdist downloaded/*.tar.gz \
            --plugin-dir claude-plugin \
            --expected-version "$EXPECTED_VERSION" \
            --expected-ref "$GITHUB_REF" \
            --expected-commit "$GITHUB_SHA" \
            --release-plugin
      # A modified wheel must be rejected by the same command consumers run
      # (docs/verifying-releases.md), and for the right reason: gh reports "no
      # attestations found" when the API lists none for the new digest. Any
      # other failure (network, auth, a gh change) proves nothing, so it fails
      # this step instead of passing it. The step above just verified the
      # untampered wheel with the same flags.
      - name: Prove a modified wheel is rejected for lack of an attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHEEL=$(basename downloaded/*.whl)
          mkdir tampered
          cp "downloaded/$WHEEL" "tampered/$WHEEL"
          printf 'tampered' >> "tampered/$WHEEL"
          if gh attestation verify "tampered/$WHEEL" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners > "$RUNNER_TEMP/tampered.log" 2>&1; then
            cat "$RUNNER_TEMP/tampered.log"
            echo "error: attestation verification accepted a modified wheel" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/tampered.log"
          if ! grep -qF "no attestations found" "$RUNNER_TEMP/tampered.log"; then
            echo "error: verification of the modified wheel failed for another" \
              "reason than a missing attestation; the tamper check is inconclusive" >&2
            exit 1
          fi
