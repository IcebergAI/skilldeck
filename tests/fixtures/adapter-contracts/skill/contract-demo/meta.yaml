name: contract-demo
description: "Contract fixture: a synthetic review skill that pins every adapter's rendered bytes, long enough that YAML folds it onto a second line."
category: testing
version: "1.2.3"
supported-agents:
  - claude
  - codex
  - copilot
  - cursor
  - kiro
capabilities:
  schema: 1
  files:
    read: diff
    write: none
  commands:
    - git diff
    - <the project's test command>
  network: []
  credentials: []
  tools: []
  artifacts: []
