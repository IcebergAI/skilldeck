skill: dependency-review
plants:
  # Dependency confusion: pip checks --index-url and --extra-index-url with "no
  # priority" and installs the best version match, so anyone who publishes
  # corp-auth-client (say 2.99) on public PyPI replaces the internal package.
  # Grounded in pip's install docs ("Finding Packages", and the warning that
  # using --extra-index-url for private packages is unsafe):
  # https://pip.pypa.io/en/stable/cli/pip_install/
  - file: requirements.txt
    keywords:
      - confusion
      - substitution
      - public index
      - public PyPI
      - higher version
      - highest version
    # dependency-review's location slot names the package (`package old→new`)
    # rather than a file:line, so these place a finding at the plant too
    locators: [corp-auth-client, index-url]
    min-severity: high
max-findings: 3
