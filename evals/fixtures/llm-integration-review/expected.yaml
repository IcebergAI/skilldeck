# A staff-only endpoint asks an LLM to draft a reply to a customer's ticket and
# lets it call a diagnostics tool on the order-service host. The ticket body is
# written by the customer, so whatever it says steers the model's tool calls.
skill: llm-integration-review
plants:
  # the model-chosen string runs through a shell with no allow-list or human
  # confirmation, so ticket text can drive arbitrary commands on the host
  - file: app/assistant.py
    keywords:
      - code execution
      - RCE
      - arbitrary command
      - arbitrary commands
      - arbitrary shell
      - command injection
      - allow-list
      - allowlist
      - allow list
      - confirmation
      - approval
    # the rubric rates attacker-controlled content reaching a shell critical;
    # one step below, so a critical/high split passes but a buried medium fails
    min-severity: high
  # the tool-calling loop has no round cap and the request no output-token cap
  - file: app/assistant.py
    keywords:
      - unbounded
      - infinite
      - runaway
      - max_tokens
      - max_completion_tokens
      - max tokens
      - token limit
      - step limit
      - iteration limit
      - iteration cap
      - loop limit
      - recursion
      - denial of wallet
      - cost
      - spending
max-findings: 5
