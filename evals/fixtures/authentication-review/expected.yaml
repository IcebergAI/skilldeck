skill: authentication-review
plants:
  # hand-rolled code flow: no per-transaction `state` (or PKCE) bound to the
  # browser session, so the callback accepts any authorization code (login CSRF)
  - file: app/sso.py
    keywords: [state, PKCE, CSRF, code_verifier]
    # the rubric names missing state/PKCE high; one step below
    min-severity: medium
  # the local account is keyed on the IdP's email claim instead of the stable
  # iss+sub subject identifier (the rubric names "identity keyed on email" high)
  - file: app/sso.py
    keywords: [sub, subject identifier, email_verified, reassignable]
    min-severity: medium
max-findings: 6
