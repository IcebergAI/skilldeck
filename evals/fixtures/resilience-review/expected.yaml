skill: resilience-review
plants:
  # The new call has a timeout (the skill's worked example is a missing one);
  # its retry loop is the problem, in two independent ways.
  #
  # 1. It retries at once, with no backoff or jitter: when the shipping service
  #    struggles, every caller fires five back-to-back attempts, multiplying
  #    the load on a dependency that is trying to recover (a retry storm). The
  #    skill rates a failure that cascades from a routine dependency failure
  #    high and degraded behavior medium; no min-severity, since one step below
  #    medium is already the floor.
  - file: services/client.py
    keywords:
      - backoff
      - back-off
      - back off
      - jitter
      - retry storm
      - thundering herd
      - immediately
      - hammer
      - hammers
  # 2. It retries a POST that creates a shipment, with no idempotency key: a
  #    read timeout after the service has created the shipment sends the same
  #    request again, so one order ships twice. The skill rates duplicated side
  #    effects under failure medium; no min-severity, for the same reason.
  - file: services/client.py
    keywords:
      - idempotent
      - non-idempotent
      - idempotency
      - duplicate
      - duplicated
      - duplicates
      - twice
      - double
max-findings: 5
