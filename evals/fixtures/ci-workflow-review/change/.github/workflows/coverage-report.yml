name: Coverage report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read the coverage summary
        run: |
          echo "PR_NUMBER=$(cat pr-number)" >> "$GITHUB_ENV"
          echo "COVERAGE=$(cat total)" >> "$GITHUB_ENV"
      - name: Label a coverage drop
        if: env.COVERAGE < 80
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --add-label coverage-drop
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ env.PR_NUMBER }}
          message: |
            Line coverage: ${{ env.COVERAGE }}%
