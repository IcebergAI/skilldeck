skill: code-smells
plants:
  # quote_total re-implements invoice_total line for line (subtotal, loyalty
  # discount, tax, rounding) instead of calling it, so the next pricing rule
  # has to be made twice and the two totals drift apart when it isn't. The
  # smell is Duplicate Code, not the Long Method of the skill's worked example.
  # Keywords name the smell, not a refactoring: "Extract" and "reuse" also fit
  # the fix for other findings. No min-severity: the skill rates this medium or
  # high, and one step below medium is already the floor.
  - file: billing/quotes.py
    keywords:
      - Duplicate Code
      - duplicate
      - duplicated
      - duplicates
      - duplication
      - copy
      - copied
      - copy-paste
      - copy-pasted
      - re-implements
      - reimplements
max-findings: 4
