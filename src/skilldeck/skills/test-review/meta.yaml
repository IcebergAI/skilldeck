name: test-review
description: Review pending changes for adequate, meaningful test coverage.
category: review
version: 0.3.1
supported-agents:
  - claude
  - codex
  - copilot
  - cursor
  - kiro
capabilities:
  schema: 1
  files:
    read: repo
    write: none
  commands:
    - git fetch
    - git diff
    - git ls-files
    - <the project's test command>
  network:
    - the git remote, via git fetch, to bring the base branch up to date
  credentials: []
  tools: []
  artifacts: []
