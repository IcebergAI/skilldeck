name: security-review
description: Review pending changes on the current branch for security vulnerabilities, aligned to OWASP ASVS 5.0.
category: security
version: 0.5.2
supported-agents:
  - claude
  - codex
  - copilot
  - cursor
  - kiro
capabilities:
  schema: 1
  files:
    read: repo
    write: none
  commands:
    - git fetch
    - git diff
    - git ls-files
  network:
    - the git remote, via git fetch, to bring the base branch up to date
  credentials: []
  tools: []
  artifacts: []
