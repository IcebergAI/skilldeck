name: migration-review
description: Review database schema and data migrations for safety under a live, rolling deploy.
category: review
version: 0.4.1
supported-agents:
  - claude
  - codex
  - copilot
  - cursor
  - kiro
capabilities:
  schema: 1
  files:
    read: repo
    write: none
  commands:
    - git fetch
    - git diff
    - git ls-files
  network:
    - the git remote, via git fetch, to bring the base branch up to date
  credentials: []
  tools: []
  artifacts: []
