name: dependency-review
description: Review dependency changes in the diff for known vulnerabilities and supply-chain risk.
category: security
version: 0.4.1
supported-agents:
  - claude
  - codex
  - copilot
  - cursor
  - kiro
capabilities:
  schema: 1
  files:
    read: repo
    write: none
  commands:
    - git fetch
    - git diff
    - git ls-files
    - npm audit
    - pip-audit
    - osv-scanner
    - govulncheck
    - cargo audit
    - gh api
  network:
    - the git remote, via git fetch, to bring the base branch up to date
    - vulnerability databases and package registries, queried by the audit commands
    - GitHub's advisory API, via gh api with its existing login
    - advisory pages, fetched to verify an advisory ID before citing it
  credentials: []
  tools:
    - web fetch, to read advisory pages
  artifacts: []
